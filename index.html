<script>
'use strict';
const $=i=>document.getElementById(i),L=window.LESSONS,by=Object.fromEntries(L.map(l=>[l.id,l])),KEY='ai-path-v2';
const GOALS={A:'A 開發平台',B:'B 學會用 AI',C:'C 上真機不出事'};
const DEF=['spec','rules','log','git','test','debug','kb','review','skill','tools','team','real'];
let path=[...DEF],done=new Set(),goal='',sel='spec',view='road';
const ok=k=>Object.hasOwn(by,k),save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
function read(){const q=new URLSearchParams(location.hash.slice(1));const src=q.has('p')?{p:q.get('p'),d:q.get('d'),g:q.get('g')}:load(KEY);if(!src)return;path=[...new Set(String(src.p||'').split('.').filter(ok))];done=new Set(String(src.d||'').split('.').filter(k=>path.includes(k)));goal=Object.hasOwn(GOALS,src.g)?src.g:''}
function write(){const s={p:path.join('.'),d:path.filter(k=>done.has(k)).join('.'),g:goal};history.replaceState(null,'','#'+new URLSearchParams(s));save(KEY,s)}
let tt;function toast(m){$('toast').textContent=m;$('toast').hidden=false;clearTimeout(tt);tt=setTimeout(()=>$('toast').hidden=true,3200)}
const art=(l,w,h)=>{const s=EnvEngine.svgEl('svg',{viewBox:`0 0 ${w} ${h}`,'aria-hidden':'true'});s.innerHTML=EnvEngine.thumb(l.model,l.layer,w/2,h-4,Math.min(w,h)-10);return s};
/* ---- 路線圖 ---- */
const NW=148,NH=196,CY=134;let slots=[];
function layout(){const W=$('road').clientWidth,cols=Math.max(2,Math.min(5,Math.floor((W-60)/165))),gap=(W-60)/cols;slots=path.map((k,i)=>{const r=Math.floor(i/cols),c=i%cols,x=30+gap*((r%2?cols-1-c:c)+.5);return{x,y:r*(NH+44)+CY+22}});return{W,cols,gap}}
function roadPath(n=1e9){const{W,cols,gap}=layout();const stopAt=Math.min(n,slots.length);if(!slots.length)return'';let d=`M${slots[0].x} ${slots[0].y}`;for(let i=1;i<stopAt;i++){const a=slots[i-1],b=slots[i];if(a.y===b.y)d+=`L${b.x} ${b.y}`;else{const out=b.x>W/2?1:-1,R=Math.min(gap/2+10,out>0?W-20-b.x:b.x-20);d+=`C${b.x+out*R*1.33} ${a.y} ${b.x+out*R*1.33} ${b.y} ${b.x} ${b.y}`}}return d}
function drawRoad(){const R=$('road');R.textContent='';const d=roadPath(),H=slots.length?slots.at(-1).y+NH-CY+10:160;R.style.height=H+'px';const s=EnvEngine.svgEl('svg',{});const at=stepOf(),lit=EnvEngine.svgEl('path',{class:'road-lit',d});s.append(EnvEngine.svgEl('path',{class:'road-bg',d}),lit,EnvEngine.svgEl('path',{class:'road-ln',d}));R.append(s);
 const was=drag?at:walked,full=lit.getTotalLength?.()||0,len=i=>{if(i<=0||!full)return 0;const p=EnvEngine.svgEl('path',{d:roadPath(i+1)});s.append(p);const n=p.getTotalLength();p.remove();return n},L1=len(at);lit.setAttribute('stroke-dasharray',`${L1} ${full+10}`);if(L1<=0)lit.setAttribute('visibility','hidden');
 const moving=!drag&&was!==at&&!quiet.matches&&at>=0;if(moving&&L1>0)lit.animate([{strokeDasharray:`${Math.max(.1,len(Math.max(0,was)))} ${full+10}`},{strokeDasharray:`${L1} ${full+10}`}],{duration:Math.min(1400,350+Math.abs(at-was)*180),easing:'cubic-bezier(.16,1,.3,1)'});if(!drag)walked=at;
 if(!path.length){const p=document.createElement('p');p.className='note';p.style.padding='60px 20px';p.textContent='路上還沒有課。從下面拖上來，或點一課按「加進路徑」。';R.append(p)}
 path.forEach((k,i)=>{const l=by[k],e=document.createElement('div');e.className='node '+(done.has(k)?'done ':'')+(i<=at?'lit ':done.has(k)?'':'plan ')+(k===sel?'sel ':'')+(goal&&!l.tag.includes(goal)?'faint':'');e.dataset.k=k;e.tabIndex=0;e.setAttribute('role','button');e.setAttribute('aria-label',`第 ${i+1} 課 ${l.name}，左右鍵走上一步下一步，Alt 加左右鍵換順序`);e.style.left=slots[i].x-NW/2+'px';e.style.top=slots[i].y-CY+'px';const n=document.createElement('i');n.textContent=done.has(k)?'✓':i+1;const b=document.createElement('b');b.textContent=l.name;const g=art(l,120,104);e.append(g,n,b);R.append(e);if(moving&&i<=at&&i>was){const dl=Math.min(1000,(i-Math.max(0,was))*150);g.animate([{opacity:.15,transform:'translateY(-26px) scale(.85)'},{opacity:1,transform:'translateY(4px) scale(1.06)',offset:.7},{opacity:1,transform:'none'}],{duration:620,delay:dl,fill:'backwards',easing:'cubic-bezier(.2,.8,.2,1)'});n.animate([{transform:'scale(.6)'},{transform:'scale(1.25)'},{transform:'none'}],{duration:500,delay:dl,fill:'backwards'})}});
 const T=$('trayList');T.textContent='';const rest=L.filter(l=>!path.includes(l.id));$('trayHint').hidden=rest.length>0;for(const l of rest){const b=document.createElement('button');b.className='btn';b.dataset.k=l.id;b.textContent=l.name;b.style.touchAction='none';T.append(b)}}
let drag=null,suppress=0,walked=-1,timer=0;const quiet=matchMedia('(prefers-reduced-motion:reduce)');const stepOf=()=>path.indexOf(sel);
function stop(){clearInterval(timer);timer=0;$('play').textContent='自動走'}

document.addEventListener('pointerdown',e=>{if(e.button||drag)return;const n=e.target.closest('.node'),b=e.target.closest('#trayList .btn'),t=n||b;if(!t)return;if(n&&e.pointerType!=='mouse'&&!e.target.closest('i'))return;drag={k:t.dataset.k,id:e.pointerId,x:e.clientX,y:e.clientY,from:n?'road':'tray',on:false,orig:[...path]}});
document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;drag.on=true;try{document.body.setPointerCapture(e.pointerId)}catch(_){}drag.el=document.createElement('div');drag.el.className='node drag';drag.el.style.cssText='position:fixed;pointer-events:none';const b=document.createElement('b');b.textContent=by[drag.k].name;drag.el.append(art(by[drag.k],120,104),b);document.body.append(drag.el)}
 e.preventDefault();drag.el.style.left=e.clientX-NW/2+'px';drag.el.style.top=e.clientY-70+'px';if(e.clientY>innerHeight-50)scrollBy(0,14);else if(e.clientY<50)scrollBy(0,-14);
 const r=$('road').getBoundingClientRect(),inRoad=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;const base=path.filter(k=>k!==drag.k);let next=base;if(inRoad){path=[...base,drag.k];layout();const x=e.clientX-r.left,y=e.clientY-r.top;let best=0,bd=1e9;slots.forEach((s,i)=>{const q=Math.hypot(s.x-x,(s.y-30-y)*1.2);if(q<bd){bd=q;best=i}});next=[...base];next.splice(best,0,drag.k)}
 $('tray').classList.toggle('over',!inRoad);path=next;drawRoad();const me=document.querySelector(`.node[data-k="${drag.k}"]:not(.drag)`);if(me)me.style.opacity=.25});
function end(e){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;if(d.on){d.el.remove();$('tray').classList.remove('over');suppress=Date.now();if(e.type==='pointercancel')path=d.orig;if(!path.includes(d.k))done.delete(d.k);sel=d.k;draw()}}
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
document.addEventListener('click',e=>{const t=e.target.closest('.node,#trayList .btn');if(!t||Date.now()-suppress<250)return;stop();sel=t.dataset.k;draw()});
document.addEventListener('keydown',e=>{const n=e.target.closest?.('.node');if(!n)return;const k=n.dataset.k,i=path.indexOf(k),j=e.key==='ArrowLeft'?i-1:e.key==='ArrowRight'?i+1:-1;if(e.key==='Enter'||e.key===' '){e.preventDefault();sel=k;draw()}else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&j>=0&&j<path.length){e.preventDefault();stop();if(e.altKey)move(i,j);else{go(j);document.querySelector(`.node[data-k="${path[j]}"]`)?.focus();return}}else return;document.querySelector(`.node[data-k="${k}"]`)?.focus()});
function move(a,b){const[k]=path.splice(a,1);path.splice(b,0,k);draw()}
/* ---- 我的環境 ---- */
let scene;const objects=[{id:'you',name:'你',short:'你',model:'you',layer:'you',zone:'base',pos:[2,10.6]},{id:'desk',name:'AI 和它的桌面',short:'AI',model:'desk',layer:'you',zone:'base',pos:[3.6,9.4]},...L.map(l=>({...l,zone:l.id==='kb'?'a2':l.zone}))];
let officeAt=-2;
function drawOffice(){const first=!scene;if(first)scene=new EnvEngine.Scene($('stage'),{zones:window.ZONES,objects},{label:'我的 AI 工作環境',pick:k=>{if(ok(k)){stop();sel=k;draw()}},maxZoom:2,pad:w=>w<600?[34,16,34,44]:[50,30,50,100]});
 const all=objects.map(o=>o.id),at=stepOf(),lit=new Set(['you','desk',...path.slice(0,at+1),...done]),from=at>0?path[at-1]:at===0?'desk':null,moved=officeAt!==at||!first&&scene.state?.sel!==sel;
 scene.set({present:all,named:[...lit,sel],sel,wires:[],flows:from?[{hops:[{from,to:sel,label:'',kind:'ask'}]}]:[],focus:all,snap:first});

 if(moved&&!quiet.matches&&ok(sel)){const b=scene.objs[sel].el.querySelector('.body');b.animate([{transform:'translateY(-60px)',opacity:.1},{transform:'translateY(5px)',opacity:1,offset:.65},{transform:'translateY(-3px)',offset:.82},{transform:'none',opacity:1}],{duration:760,easing:'ease-out'})}
 officeAt=at}

function info(){const l=by[sel],A=$('info');A.textContent='';const E=(t,s,c)=>{const e=document.createElement(t);e.textContent=s;if(c)e.className=c;A.append(e);return e};E('h2',l.name);E('p','適合：'+[...l.tag].map(t=>GOALS[t]).join('、'),'tags');for(const[a,b]of[['會卡住什麼','stuck'],['這是什麼','what'],['為什麼要這樣做','why'],['現在就能自己試','tryit'],['上課一起做','together'],['學完帶走','take']]){E('h3',a);E('p',l[b])}
 const i=path.indexOf(l.id),miss=l.pre.filter(p=>{const q=path.indexOf(p);return q<0||(i>=0&&q>i)});if(miss.length)E('p','建議先學：'+miss.map(m=>by[m].name).join('、')+'。想直接學也可以。','tip');
 const d=E('div','','acts'),B=(t,f,c='')=>{const b=document.createElement('button');b.className='btn '+c;b.textContent=t;b.onclick=f;d.append(b)};if(i<0)B('加進路徑',()=>{path.push(l.id);draw()},'main');else{B(done.has(l.id)?'改回還沒學':'學會了',()=>{done.has(l.id)?done.delete(l.id):done.add(l.id);draw()},'main');if(i)B('往前',()=>move(i,i-1));if(i<path.length-1)B('往後',()=>move(i,i+1));B('移出',()=>{path.splice(i,1);done.delete(l.id);draw()})}}
function draw(){write();const G=document.querySelector('.goal');G.textContent='';const s=document.createElement('span');s.textContent='我的目的';G.append(s);for(const g in GOALS){const b=document.createElement('button');b.className='btn'+(goal===g?' on':'');b.textContent=GOALS[g];b.setAttribute('aria-pressed',goal===g);b.onclick=()=>{goal=goal===g?'':g;draw()};G.append(b)}
 for(const v of['road','office'])$('v-'+v).hidden=v!==view;$('prev').disabled=stepOf()<=0;$('next').disabled=stepOf()>=path.length-1;document.querySelectorAll('.seg [data-v]').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===view));if(view==='road')drawRoad();else drawOffice();info()}
document.querySelectorAll('.seg [data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;if(view==='road')walked=-1;draw()});
$('prev').onclick=()=>{stop();go(Math.max(0,stepOf()-1))};$('next').onclick=()=>{stop();go(stepOf()+1)};
$('play').onclick=()=>{if(timer)return stop();if(!path.length)return;go(stepOf()>=path.length-1?0:Math.max(0,stepOf()));$('play').textContent='停下來';timer=setInterval(()=>{if(!go(stepOf()+1))stop()},1900)};
$('share').onclick=async()=>{write();try{await navigator.clipboard.writeText(location.href);toast('已複製。把連結傳給老師就看得到')}catch(e){toast('複製失敗，請直接複製網址列')}};

if(load('ai-path-theme')==='light')document.documentElement.dataset.theme='light';
